services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: artex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [pentera-net]

  artex:
    image: artex:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://artex:${POSTGRES_PASSWORD}@postgres:5432/artex?sslmode=disable
      ARTEX_OPERATOR_HINT: "open console: http://localhost:9100  tunnel: ssh -L 8787:127.0.0.1:8787 -L 9100:127.0.0.1:9100 hunter@173.249.6.22"
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
    restart: unless-stopped
    networks: [pentera-net]

networks:
  pentera-net:
    name: pentera-net
    external: true

volumes:
  pgdata:
